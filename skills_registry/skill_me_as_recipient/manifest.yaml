id: "skill_me_as_recipient"
name: "Direct Recipient Handling"
description: "Detects emails where 'I' am a direct recipient (To) and ensures they are processed."
version: "1.0.0"
execution_mode: "modifier"

triggers:
  priority: 90
  conditions:
    - type: "to_match"
      operator: "contains"
      value: "$ME"
