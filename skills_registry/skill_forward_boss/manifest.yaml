id: "skill_forward_boss"
name: "Forward to Boss Verification"
description: "Detects crucial emails and drafts a forward to the boss."
version: "1.0.0"
mode: "modifier"
triggers:
  priority: 100
  conditions:
    - type: "sender_match"
      value: ["important@client.com"]
      operator: "in"
