id: "skill_ops_log_silent"
name: "Ops Log Silent Read"
description: "Detects daily ops handover logs and marks them as read-only P3 notifications."
version: "1.0.0"
execution_mode: "modifier"

triggers:
  priority: 90
  conditions:
    - type: "subject_match"
      operator: "contains"
      value: "运维值班交接日志"
