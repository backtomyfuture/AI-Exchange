id: "skill_project_tracker"
name: "Project Auto-Tracker"
description: "Identifies project codes in emails and enriches the context with project-specific metadata."
version: "1.0.0"
execution_mode: "modifier"

triggers:
  priority: 90
  conditions:
    - type: "subject_match"
      operator: "regex"
      value: "P-\\d{4}|项目|Project"
