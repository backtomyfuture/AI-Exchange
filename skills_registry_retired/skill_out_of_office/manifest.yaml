id: "skill_out_of_office"
name: "Out of Office Detection"
description: "Detects if the user is currently out of office and adjusts replies accordingly."
version: "1.0.0"
execution_mode: "modifier"

triggers:
  priority: 70
  conditions:
    - type: "body_match"
      operator: "regex"
      value: "vacation|leave|out of office|休假|年假|出差"
