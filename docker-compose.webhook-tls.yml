# Optional TLS ingress for Exchange Gateway callbacks.
#
# The base application remains HTTP-only inside Docker.  This overlay exposes
# only the signed Exchange webhook and readiness endpoints over TLS.
services:
  webhook-tls-ingress:
    image: >-
      nginxinc/nginx-unprivileged:1.27.5-alpine@sha256:65e3e85dbaed8ba248841d9d58a899b6197106c23cb0ff1a132b7bfe0547e4c0
    restart: always
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m,mode=0755
    ports:
      - "${WEBHOOK_TLS_PORT:-8443}:8443"
    volumes:
      - type: bind
        source: ./deploy/webhook-tls/nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
    secrets:
      - source: webhook_tls_fullchain
        target: webhook_tls_fullchain.pem
      - source: webhook_tls_key
        target: webhook_tls_key.pem
    depends_on:
      ai-assistant-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --no-check-certificate
        - --output-document=/dev/null
        - https://127.0.0.1:8443/healthz
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - edge
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  webhook_tls_fullchain:
    file: ./secrets/webhook_tls_fullchain.pem
  webhook_tls_key:
    file: ./secrets/webhook_tls_key.pem
