services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_data:/qdrant/storage

  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: email_agent
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d email_agent" ]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-assistant-service:
    build: .
    restart: always
    command: python -m src.main
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - QDRANT_URL=http://qdrant:6333
      - POSTGRES_HOST=postgres
      - TZ=Asia/Shanghai
      - EXTERNAL_URL=http://localhost:8000
    ports:
      - "8000:8000"
      - "15000:8000"
    depends_on:
      qdrant:
        condition: service_started
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./skills_registry:/app/skills_registry
      - content_data:/app/data/content
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

volumes:
  content_data:
