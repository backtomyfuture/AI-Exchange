services:
  qdrant:
    container_name: ai-exchange-qdrant
    image: qdrant/qdrant:v1.17.0@sha256:f1c7272cdac52b38c1a0e89313922d940ba50afd90d593a1605dbbc214e66ffb
    restart: always
    command: ["./entrypoint.sh", "--disable-telemetry"]
    expose:
      - "6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test:
        - CMD
        - /usr/bin/bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/6333;
          printf 'GET /healthz HTTP/1.0\r\n\r\n' >&3;
          grep -q '200 OK' <&3
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend

  postgres:
    container_name: ai-exchange-postgres
    image: postgres:15@sha256:f30e3de0ac9cc938dac627ef2231099867c694b5f949fadb924c8c977428c399
    restart: always
    environment:
      POSTGRES_USER: ai_exchange_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_DB: email_agent
    secrets:
      - source: postgres_admin_password
        target: postgres_admin_password
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/010-peer-database-acl.sql:/docker-entrypoint-initdb.d/010-peer-database-acl.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  database-provision:
    profiles: ["database-provision"]
    build:
      context: .
      args:
        TIER1_ARTIFACT_DIGEST: ${TIER1_ARTIFACT_DIGEST:?TIER1_ARTIFACT_DIGEST is required}
    image: ${AI_EXCHANGE_IMAGE:-ai-exchange:local}
    restart: "no"
    command: ["python", "-m", "src.db.provision"]
    # Administrator access exists only in this explicit greenfield one-shot.
    # Compose file secrets retain host ownership, so only read-DAC is restored.
    user: "0:0"
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["DAC_READ_SEARCH"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=16m,mode=1777
    environment:
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
      DATABASE_PROVISION_ADMIN_URL_FILE: /run/secrets/database_provision_admin_url
      POSTGRES_DB: email_agent
      POSTGRES_SCHEMA: public
      POSTGRES_MIGRATION_OWNER_ROLE: ai_exchange_migration_owner
      POSTGRES_RUNTIME_ROLE: ai_exchange_runtime
      POSTGRES_MAINTENANCE_ROLE: ai_exchange_checkpoint_maintenance
      POSTGRES_CHECKPOINT_AUDITOR_ROLE: ai_exchange_checkpoint_auditor
      POSTGRES_MIGRATION_PASSWORD_FILE: /run/secrets/postgres_migration_password
      POSTGRES_RUNTIME_PASSWORD_FILE: /run/secrets/postgres_runtime_password
      POSTGRES_MAINTENANCE_PASSWORD_FILE: /run/secrets/postgres_maintenance_password
      POSTGRES_CHECKPOINT_AUDITOR_PASSWORD_FILE: /run/secrets/postgres_checkpoint_auditor_password
      TZ: Asia/Shanghai
    secrets:
      - source: database_provision_admin_url
        target: database_provision_admin_url
      - source: postgres_migration_password
        target: postgres_migration_password
      - source: postgres_runtime_password
        target: postgres_runtime_password
      - source: postgres_maintenance_password
        target: postgres_maintenance_password
      - source: postgres_checkpoint_auditor_password
        target: postgres_checkpoint_auditor_password
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  database-bootstrap:
    profiles: ["migration"]
    build:
      context: .
      args:
        TIER1_ARTIFACT_DIGEST: ${TIER1_ARTIFACT_DIGEST:?TIER1_ARTIFACT_DIGEST is required}
    image: ${AI_EXCHANGE_IMAGE:-ai-exchange:local}
    restart: "no"
    command: ["python", "-m", "src.db.bootstrap"]
    # Compose file-backed secrets cannot remap uid/gid/mode. The host source
    # must be 0600; this isolated one-shot retains only read-DAC override so
    # native Linux can read a deployment-user-owned bind source.
    user: "0:0"
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["DAC_READ_SEARCH"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=16m,mode=1777
    environment:
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
      MIGRATION_DATABASE_URL_FILE: /run/secrets/migration_database_url
      POSTGRES_MIGRATION_OWNER_ROLE: ai_exchange_migration_owner
      POSTGRES_RUNTIME_ROLE: ai_exchange_runtime
      POSTGRES_MAINTENANCE_ROLE: ai_exchange_checkpoint_maintenance
      POSTGRES_CHECKPOINT_AUDITOR_ROLE: ai_exchange_checkpoint_auditor
      POSTGRES_SCHEMA: public
      TZ: Asia/Shanghai
    secrets:
      - source: migration_database_url
        target: migration_database_url
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  ingestion-maintenance:
    profiles: ["ingestion-maintenance"]
    build:
      context: .
      args:
        TIER1_ARTIFACT_DIGEST: ${TIER1_ARTIFACT_DIGEST:?TIER1_ARTIFACT_DIGEST is required}
    image: ${AI_EXCHANGE_IMAGE:-ai-exchange:local}
    restart: "no"
    entrypoint: ["python", "scripts/manage_ingestion.py"]
    command: ["--help"]
    # This explicit one-shot receives only the restricted ingestion-maintenance
    # DSN. Policy/contract inputs are mounted per invocation, never baked in.
    user: "0:0"
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["DAC_READ_SEARCH"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=16m,mode=1777
    environment:
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
      INGESTION_MAINTENANCE_DATABASE_URL_FILE: /run/secrets/ingestion_maintenance_database_url
      POSTGRES_MIGRATION_OWNER_ROLE: ai_exchange_migration_owner
      POSTGRES_RUNTIME_ROLE: ai_exchange_runtime
      POSTGRES_MAINTENANCE_ROLE: ai_exchange_checkpoint_maintenance
      POSTGRES_CHECKPOINT_AUDITOR_ROLE: ai_exchange_checkpoint_auditor
      POSTGRES_SCHEMA: public
      TZ: Asia/Shanghai
    secrets:
      - source: ingestion_maintenance_database_url
        target: ingestion_maintenance_database_url
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  checkpoint-maintenance:
    profiles: ["checkpoint-maintenance"]
    build:
      context: .
      args:
        TIER1_ARTIFACT_DIGEST: ${TIER1_ARTIFACT_DIGEST:?TIER1_ARTIFACT_DIGEST is required}
    image: ${AI_EXCHANGE_IMAGE:-ai-exchange:local}
    restart: "no"
    entrypoint: ["python", "scripts/checkpoint_cleanup.py"]
    command: ["--help"]
    # Compose file-backed secrets retain their host ownership/mode. Keep the
    # auditor DSN at 0600; this manual one-shot gets only read-DAC override.
    user: "0:0"
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["DAC_READ_SEARCH"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=16m,mode=1777
    environment:
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
      XDG_STATE_HOME: /var/lib
      CHECKPOINT_AUDITOR_DATABASE_URL_FILE: /run/secrets/checkpoint_auditor_database_url
      POSTGRES_CHECKPOINT_AUDITOR_ROLE: ai_exchange_checkpoint_auditor
      POSTGRES_MAINTENANCE_ROLE: ai_exchange_checkpoint_maintenance
      POSTGRES_RUNTIME_ROLE: ai_exchange_runtime
      POSTGRES_MIGRATION_OWNER_ROLE: ai_exchange_migration_owner
      POSTGRES_SCHEMA: public
      TZ: Asia/Shanghai
    secrets:
      - source: checkpoint_auditor_database_url
        target: checkpoint_auditor_database_url
    volumes:
      - checkpoint_maintenance_state:/var/lib/ai-exchange/checkpoint-cleanup
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  checkpoint-maintenance-execute:
    profiles: ["checkpoint-maintenance-execute"]
    build:
      context: .
      args:
        TIER1_ARTIFACT_DIGEST: ${TIER1_ARTIFACT_DIGEST:?TIER1_ARTIFACT_DIGEST is required}
    image: ${AI_EXCHANGE_IMAGE:-ai-exchange:local}
    restart: "no"
    entrypoint: ["python", "scripts/checkpoint_cleanup.py"]
    command: ["execute", "--help"]
    user: "0:0"
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["DAC_READ_SEARCH"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=16m,mode=1777
    environment:
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
      XDG_STATE_HOME: /var/lib
      CHECKPOINT_MAINTENANCE_DATABASE_URL_FILE: /run/secrets/checkpoint_maintenance_database_url
      CHECKPOINT_MAINTENANCE_RECEIPT_ED25519_PUBLIC_KEY_FILE: /run/secrets/checkpoint_maintenance_receipt_ed25519_public_key
      POSTGRES_MAINTENANCE_ROLE: ai_exchange_checkpoint_maintenance
      POSTGRES_RUNTIME_ROLE: ai_exchange_runtime
      POSTGRES_MIGRATION_OWNER_ROLE: ai_exchange_migration_owner
      POSTGRES_CHECKPOINT_AUDITOR_ROLE: ai_exchange_checkpoint_auditor
      POSTGRES_SCHEMA: public
      TZ: Asia/Shanghai
    secrets:
      - source: checkpoint_maintenance_database_url
        target: checkpoint_maintenance_database_url
      - source: checkpoint_maintenance_receipt_ed25519_public_key
        target: checkpoint_maintenance_receipt_ed25519_public_key
    volumes:
      - checkpoint_maintenance_state:/var/lib/ai-exchange/checkpoint-cleanup
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  ai-assistant-service:
    container_name: ai-exchange
    build:
      context: .
      args:
        TIER1_ARTIFACT_DIGEST: ${TIER1_ARTIFACT_DIGEST:?TIER1_ARTIFACT_DIGEST is required}
    image: ${AI_EXCHANGE_IMAGE:-ai-exchange:local}
    restart: always
    command: python -m src.main
    user: "1000:1000"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      APP_ENV: production
      DEBUG: "false"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      EXTERNAL_URL: ${EXTERNAL_URL:?EXTERNAL_URL is required}
      QDRANT_URL: http://qdrant:6333
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ai_exchange_runtime
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_runtime_password
      POSTGRES_DB: email_agent
      POSTGRES_SCHEMA: public
      POSTGRES_MIGRATION_OWNER_ROLE: ai_exchange_migration_owner
      POSTGRES_MAINTENANCE_ROLE: ai_exchange_checkpoint_maintenance
      POSTGRES_CHECKPOINT_AUDITOR_ROLE: ai_exchange_checkpoint_auditor
      DATABASE_ROLE_SEPARATION_REQUIRED: "true"
      DURABLE_INBOX_ENABLED: "true"
      POLLING_ENABLED: "true"
      POLLING_INTERVAL_SECONDS: "60"
      MEMORY_LEARNING_ENABLED: "false"
      TIER1_ARTIFACT_DIR: /app/tier1_artifacts
      TIER1_ARTIFACT_DIGEST: ${TIER1_ARTIFACT_DIGEST:?TIER1_ARTIFACT_DIGEST is required}
      EXCHANGE_SSL_VERIFY: "true"
      EXCHANGE_API_URL: ${EXCHANGE_API_URL:?EXCHANGE_API_URL is required}
      EXCHANGE_API_KEY: ${EXCHANGE_API_KEY:?EXCHANGE_API_KEY is required}
      EXCHANGE_ACCOUNT_ID: ${EXCHANGE_ACCOUNT_ID:?EXCHANGE_ACCOUNT_ID is required}
      EXCHANGE_ACCOUNT_EMAIL: ${EXCHANGE_ACCOUNT_EMAIL:?EXCHANGE_ACCOUNT_EMAIL is required}
      EXCHANGE_FOLDERS_ARCHIVE: ${EXCHANGE_FOLDERS_ARCHIVE:-}
      LEADER_SENDERS: ${LEADER_SENDERS:-}
      LARK_APP_ID: ${LARK_APP_ID:?LARK_APP_ID is required}
      LARK_APP_SECRET: ${LARK_APP_SECRET:?LARK_APP_SECRET is required}
      LARK_ENCRYPT_KEY: ${LARK_ENCRYPT_KEY:?LARK_ENCRYPT_KEY is required}
      LARK_CHAT_ID: ${LARK_CHAT_ID:?LARK_CHAT_ID is required}
      LARK_DRIVE_FOLDER_TOKEN: ${LARK_DRIVE_FOLDER_TOKEN:-}
      LARK_ALLOWED_OPEN_IDS: ${LARK_ALLOWED_OPEN_IDS:?LARK_ALLOWED_OPEN_IDS is required}
      METRICS_TOKEN_FILE: /run/secrets/metrics_token
      CONTENT_STORE_KEY_FILE: /run/secrets/content_store_key
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      OPENAI_API_BASE: ${OPENAI_API_BASE:?OPENAI_API_BASE is required}
      LLM_MODEL: ${LLM_MODEL:?LLM_MODEL is required}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:?EMBEDDING_API_KEY is required}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:?EMBEDDING_BASE_URL is required}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:?EMBEDDING_MODEL is required}
      TZ: Asia/Shanghai
    secrets:
      - source: postgres_runtime_password
        target: postgres_runtime_password
      - source: metrics_token
        target: metrics_token
      - source: content_store_key
        target: content_store_key
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - content_data:/app/data/content
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      # A new data volume establishes its sync_state baseline before /ready
      # succeeds.  Keep Docker from treating that bounded initialization as a
      # crash while the deployment tool waits for the real readiness contract.
      start_period: 900s
    stop_grace_period: 150s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
          pids: 256
    networks:
      - backend
      - edge

networks:
  backend:
    internal: true
  edge: {}

volumes:
  checkpoint_maintenance_state:
  content_data:
  postgres_data:
  qdrant_data:

secrets:
  postgres_admin_password:
    file: ./secrets/postgres_admin_password
  database_provision_admin_url:
    file: ./secrets/database_provision_admin_url
  postgres_migration_password:
    file: ./secrets/postgres_migration_password
  postgres_runtime_password:
    file: ./secrets/postgres_runtime_password
  postgres_maintenance_password:
    file: ./secrets/postgres_maintenance_password
  postgres_checkpoint_auditor_password:
    file: ./secrets/postgres_checkpoint_auditor_password
  checkpoint_auditor_database_url:
    file: ./secrets/checkpoint_auditor_database_url
  checkpoint_maintenance_database_url:
    file: ./secrets/checkpoint_maintenance_database_url
  checkpoint_maintenance_receipt_ed25519_public_key:
    file: ./secrets/checkpoint_maintenance_receipt_ed25519_public_key
  migration_database_url:
    file: ./secrets/migration_database_url
  ingestion_maintenance_database_url:
    file: ./secrets/ingestion_maintenance_database_url
  metrics_token:
    file: ./secrets/metrics_token
  content_store_key:
    file: ./secrets/content_store_key
