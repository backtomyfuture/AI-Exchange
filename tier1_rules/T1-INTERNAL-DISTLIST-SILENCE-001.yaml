schema_version: 1
rule_id: T1-INTERNAL-DISTLIST-SILENCE-001
rule_version: 2
status: enabled
owner: mailbox-owner
purpose: >
  Consolidates 11 legacy skills_registry/skill_auto_* rules
  (gs4193/hhlyrlzyb/hhsc/m_wu/shj_zhen/thitzb/thxxcxb/thxxyfzx/tjhkgh/yq_w/
  zhang_xia): each was auto-discovered from a single internal distribution-
  list address the mailbox owner belongs to, with a 0% historical reply rate
  (samples ranging 3-44 emails; thxxcxb=32 and zhang-xia=44 are the strongest-
  confidence members). Same anchor field, same route, same reason_code for
  all 11 -> one rule per design doc §4.5 (address-group inlining in
  anchor.any) instead of 11 near-duplicate single-address files.

validity:
  effective_from: "2025-01-01T00:00:00Z"
  expires_at: "2027-02-05T00:00:00Z"

match:
  anchor:
    any:
      - field: to.addresses
        op: has_any
        values:
          - gs4193@hnair.com
          - hhlyrlzyb@hnaaviation.com
          - hhsc@hnair.com
          - m.wu@tianjin-air.com
          - shj-zhen@tianjin-air.com
          - thitzb@hnair.com
          - thxxcxb@hnair.com
          - thxxyfzx@hnair.com
          - tjhkgh@tianjin-air.com
          - yq.w@tianjin-air.com
          - zhang-xia@tianjin-air.com

decision:
  route: no_action
  business_flow_id: internal-distribution-list-silence
  params:
    reason_code: internal_distribution_list

governance:
  criticality: P3
  owner_reviewed_at: "2026-08-09T00:00:00Z"
  risk_notes: >
    All 11 source addresses independently showed a 0% reply rate historically.
    Any address with a future non-zero observed reply rate must be pulled out
    of this rule's anchor list rather than left in, per design doc's no_action
    governance bar.
  positive_cases:
    - case_id: to-gs4193
      email:
        sender: {address: some-ops@hnair.com}
        to: [gs4193@hnair.com]
    - case_id: to-zhang-xia
      email:
        sender: {address: some-ops@tianjin-air.com}
        to: [zhang-xia@tianjin-air.com]
    - case_id: to-thxxcxb-with-other-cc
      email:
        sender: {address: some-ops@hnair.com}
        to: [thxxcxb@hnair.com]
        cc: [uninvolved@example.com]
  negative_cases:
    - case_id: unrelated-recipient
      email:
        sender: {address: some-ops@hnair.com}
        to: [someone-else@hnair.com]
    - case_id: distlist-address-only-in-cc-not-to
      email:
        sender: {address: some-ops@hnair.com}
        to: [q-fu@tianjin-air.com]
        cc: [gs4193@hnair.com]
