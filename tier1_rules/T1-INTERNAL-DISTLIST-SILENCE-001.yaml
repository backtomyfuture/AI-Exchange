schema_version: 1
rule_id: T1-INTERNAL-DISTLIST-SILENCE-001
rule_version: 4
status: enabled
owner: mailbox-owner
purpose: >
  Consolidates 11 legacy skills_registry/skill_auto_* rules
  (gs4193/hhlyrlzyb/hhsc/m_wu/shj_zhen/thitzb/thxxcxb/thxxyfzx/tjhkgh/yq_w/
  zhang_xia): each was auto-discovered from a single internal distribution-
  list address the mailbox owner belongs to, with a 0% historical reply rate
  (samples ranging 3-44 emails). Same anchor field, same route, same
  reason_code for all 11 -> one rule per design doc §4.5 (address-group
  inlining in anchor.any) instead of 11 near-duplicate single-address files.
  Owner review on 2026-08-10 pulled m.wu/shj-zhen/yq.w/zhang-xia out of the
  group list: m.wu and zhang-xia are now treated as individual senders
  (T1-ZHANGXIA-FORWARD-READONLY-001 covers their forwards) and shj-zhen/yq.w
  rejoin normal Tier 2/3 routing instead of unconditional silence. Owner
  review on 2026-08-12 moved thxxcxb/thxxyfzx to
  T1-INTERNAL-DISTLIST-READONLY-001: both are department/center group
  addresses whose mail must still be read (read_only), so only 5 of the
  original 11 remain with unconditional silence.

validity:
  effective_from: "2025-01-01T00:00:00Z"
  expires_at: "2027-02-05T00:00:00Z"

match:
  anchor:
    any:
      - field: to.addresses
        op: has_any
        values:
          - gs4193@hnair.com
          - hhlyrlzyb@hnaaviation.com
          - hhsc@hnair.com
          - thitzb@hnair.com
          - tjhkgh@tianjin-air.com

decision:
  route: no_action
  business_flow_id: internal-distribution-list-silence
  params:
    reason_code: internal_distribution_list

governance:
  criticality: P3
  owner_reviewed_at: "2026-08-12T00:00:00Z"
  risk_notes: >
    All 11 source addresses independently showed a 0% reply rate historically.
    Any address with a future non-zero observed reply rate must be pulled out
    of this rule's anchor list rather than left in, per design doc's no_action
    governance bar. 2026-08-10: m.wu/shj-zhen/yq.w/zhang-xia removed per owner
    review (zhang-xia/m.wu forwards -> T1-ZHANGXIA-FORWARD-READONLY-001,
    shj-zhen/yq.w -> normal Tier 2/3). 2026-08-12: thxxcxb/thxxyfzx removed
    per owner review -> T1-INTERNAL-DISTLIST-READONLY-001 (read_only, still
    read because they are department/center group mail).
  positive_cases:
    - case_id: to-gs4193
      email:
        sender: {address: some-ops@hnair.com}
        to: [gs4193@hnair.com]
    - case_id: to-tjhkgh
      email:
        sender: {address: some-ops@tianjin-air.com}
        to: [tjhkgh@tianjin-air.com]
    - case_id: to-thitzb-with-other-cc
      email:
        sender: {address: some-ops@hnair.com}
        to: [thitzb@hnair.com]
        cc: [uninvolved@example.com]
  negative_cases:
    - case_id: unrelated-recipient
      email:
        sender: {address: some-ops@hnair.com}
        to: [someone-else@hnair.com]
    - case_id: distlist-address-only-in-cc-not-to
      email:
        sender: {address: some-ops@hnair.com}
        to: [q-fu@tianjin-air.com]
        cc: [gs4193@hnair.com]
    - case_id: removed-address-in-to-not-group-any-more
      email:
        sender: {address: some-ops@hnair.com}
        to: [zhang-xia@tianjin-air.com]
    - case_id: read-only-distlist-address-no-longer-no-action
      email:
        sender: {address: some-ops@hnair.com}
        to: [thxxcxb@hnair.com]
