name: Polling PostgreSQL Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  postgres-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15@sha256:f30e3de0ac9cc938dac627ef2231099867c694b5f949fadb924c8c977428c399
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: polling-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_POSTGRES_ADMIN_URL: postgresql://postgres:polling-ci-only@127.0.0.1:5432/postgres
      TEST_POSTGRES_ROLE_DDL: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.13"
      - name: Install system libraries
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libpq-dev libpango-1.0-0 libpangoft2-1.0-0
          libjpeg-dev libopenjp2-7-dev fonts-noto-cjk
      - name: Install locked dependency manager
        run: >-
          python -m pip install --no-cache-dir --index-url https://pypi.org/simple
          --only-binary=:all: --require-hashes --no-deps
          -r requirements.bootstrap.txt
      - name: Verify dependency lock is current
        run: uv lock --check
      - name: Sync frozen project environment
        run: uv sync --frozen
      - name: Verify installed dependency consistency
        run: uv pip check --python .venv/bin/python
      - name: Run Ruff
        run: uv run --frozen ruff check src tests
      - name: Compile Tier 1 rules
        run: uv run --frozen python -c "from src.router.tier1.compiler import compile_registry, CompilationFailure; result = compile_registry('tier1_rules', internal_email_domains=('tianjin-air.com',), me_email='q-fu@tianjin-air.com'); raise SystemExit(result.message if isinstance(result, CompilationFailure) else 0)"
      - name: Verify production wheel availability
        shell: bash
        run: |
          set -euo pipefail
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file /tmp/requirements.lock
          uv pip install --dry-run --no-cache --python-version 3.12.13 --python-platform x86_64-unknown-linux-gnu --only-binary=:all: --require-hashes --target /tmp/wheel-check-x86_64 -r /tmp/requirements.lock
          uv pip install --dry-run --no-cache --python-version 3.12.13 --python-platform aarch64-unknown-linux-gnu --only-binary=:all: --require-hashes --target /tmp/wheel-check-aarch64 -r /tmp/requirements.lock
      - name: Validate production Compose
        shell: bash
        env:
          AI_EXCHANGE_IMAGE: ai-exchange:polling-ci
          EXTERNAL_URL: https://polling-ci.invalid
          EXCHANGE_API_URL: https://exchange.polling-ci.invalid/api/v1/exchange/emails
          EXCHANGE_API_KEY: polling-ci-exchange-key
          EXCHANGE_ACCOUNT_ID: "8"
          EXCHANGE_ACCOUNT_EMAIL: polling-ci@example.invalid
          LARK_APP_ID: polling-ci-lark-app
          LARK_APP_SECRET: polling-ci-lark-secret
          LARK_ENCRYPT_KEY: polling-ci-lark-encrypt
          LARK_CHAT_ID: polling-ci-lark-chat
          LARK_ALLOWED_OPEN_IDS: polling-ci-open-id
          OPENAI_API_KEY: polling-ci-model-key
          OPENAI_API_BASE: https://models.polling-ci.invalid/v1
          LLM_MODEL: polling-ci-model
          EMBEDDING_API_KEY: polling-ci-embedding-key
          EMBEDDING_BASE_URL: https://embeddings.polling-ci.invalid/v1
          EMBEDDING_MODEL: polling-ci-embedding-model
          TIER1_ARTIFACT_DIGEST: polling-ci-tier1-digest
        run: |
          set -euo pipefail
          docker compose --profile migration --profile checkpoint-maintenance --profile checkpoint-maintenance-execute --env-file /dev/null config --quiet
          services="$(docker compose --profile migration --profile checkpoint-maintenance --profile checkpoint-maintenance-execute --env-file /dev/null config --services)"
          for required_service in database-bootstrap checkpoint-maintenance checkpoint-maintenance-execute; do
            grep -Fqx "$required_service" <<<"$services"
          done
      - name: Verify mandatory PostgreSQL gate environment
        shell: bash
        run: |
          set -euo pipefail
          : "${TEST_POSTGRES_ADMIN_URL:?TEST_POSTGRES_ADMIN_URL is required}"
          : "${TEST_POSTGRES_ROLE_DDL:?TEST_POSTGRES_ROLE_DDL is required}"
          test "$TEST_POSTGRES_ROLE_DDL" = "1"
      - name: Run mandatory PostgreSQL suite with coverage
        run: uv run --frozen python -m pytest -q --cov=src --cov-report=term-missing
      - name: Enforce critical-module coverage
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen coverage report --precision=2 --fail-under=90 --include='src/db/access_contract.py'
          uv run --frozen coverage report --precision=2 --fail-under=90 --include='src/db/auditor.py'
          uv run --frozen coverage report --precision=2 --fail-under=90 --include='src/db/checkpoint_saver.py'
          uv run --frozen coverage report --precision=2 --fail-under=90 --include='src/db/runtime_boundary.py'
          uv run --frozen coverage report --precision=2 --fail-under=90 --include='src/db/maintenance_fence.py'
          uv run --frozen coverage report --precision=2 --fail-under=90 --include='src/db/maintenance_settings.py'
          uv run --frozen coverage report --precision=2 --fail-under=90 --include='src/ingestion/email_events.py'
          uv run --frozen coverage report --precision=2 --fail-under=90 --include='src/ingestion/recovery.py'
          uv run --frozen coverage report --precision=2 --fail-under=90 --include='src/ingestion/runtime_capability.py'
          uv run --frozen coverage report --precision=2 --fail-under=90 --include='src/db/roles.py,src/db/schema_contract.py,src/db/bootstrap.py'
